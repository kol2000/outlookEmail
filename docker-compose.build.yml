version: '3.8'

services:
  outlook-mail-local:
    build:
      context: .
      dockerfile: Dockerfile
    image: outlookemail:local
    container_name: outlook-mail-local
    ports:
      - "5000:5000"
    volumes:
      # Persistent data (database, token, etc.)
      - ./data:/app/data
      # Read-only mounting of static resources and templates (supports host editing to take effect in real time)
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
    env_file:
      - .env.local
    environment:
      - FLASK_ENV=production
      # Docker self-update (if you want to enable it, please uncomment it and confirm that DOCKER_UPDATE_ENABLED=true is in .env.local)
      # - /var/run/docker.sock:/var/run/docker.sock
      # Delete the following two lines when managing with docker-compose, and reserve them for users to enable on demand.
      # - DOCKER_UPDATE_ENABLED=true
      # - DOCKER_UPDATE_CONTAINER=outlook-mail
    # It is recommended to use mutable tag (latest / main / dev) for image tags to facilitate self-update; if a fixed version number (v2.0.x) is used, there is no update capability
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s # Leave a buffer for startup to avoid misjudgment when the health check is not ready

# If you want to use Docker named volumes instead of ./data bind mounts, uncomment the following:
# volumes:
#   outlook-data:
#     driver: local
