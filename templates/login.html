<!DOCTYPE html>
<html lang="{{ current_language() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tr("登录 - Outlook 邮件管理") }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #1a1a1a;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 48px;
            width: 400px;
            max-width: 90%;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .login-logo svg {
            width: 40px;
            height: 40px;
            color: #1a1a1a;
        }
        
        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .login-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px 24px;
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .login-btn:hover {
            background-color: #333;
        }
        
        .login-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        
        .error-message {
            background-color: #fce8e6;
            color: #c5221f;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
    <script src="{{ url_for('localized_catalog') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/i18n.css') }}">
</head>
<body>
    <div class="language-toolbar" data-language-switcher></div>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </div>
            <h1 class="login-title">{{ tr("Outlook 邮件管理") }}</h1>
            <p class="login-subtitle">{{ tr("请输入密码登录系统") }}</p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="password">{{ tr("登录密码") }}</label>
                <input type="password" class="form-input" id="password" placeholder="{{ tr("请输入密码") }}" autofocus required>
            </div>
            <div class="form-group">
                <label class="form-label" for="sessionDuration">{{ tr("登录有效期") }}</label>
                <select class="form-input" id="sessionDuration">
                    <option value="7">{{ tr("7 天") }}</option>
                    <option value="30" selected>{{ tr("30 天") }}</option>
                    <option value="90">{{ tr("90 天") }}</option>
                    <option value="180">{{ tr("180 天") }}</option>
                    <option value="permanent">{{ tr("永久有效") }}</option>
                </select>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">{{ tr("登 录") }}</button>
        </form>
    </div>
    
    <script>
        const LOGIN_DURATION_STORAGE_KEY = 'outlook_login_duration_days';
        const LOGIN_DURATION_OPTIONS = ['7', '30', '90', '180', 'permanent'];
        const DEFAULT_LOGIN_DURATION = '30';

        function loadLoginDurationPreference() {
            let storedValue = '';
            try {
                storedValue = window.localStorage.getItem(LOGIN_DURATION_STORAGE_KEY) || '';
            } catch (error) {
                storedValue = '';
            }
            return LOGIN_DURATION_OPTIONS.includes(storedValue) ? storedValue : DEFAULT_LOGIN_DURATION;
        }

        function saveLoginDurationPreference(value) {
            if (!LOGIN_DURATION_OPTIONS.includes(value)) {
                return;
            }
            try {
                window.localStorage.setItem(LOGIN_DURATION_STORAGE_KEY, value);
            } catch (error) {
                // 本地存储不可用时不阻断登录。
            }
        }

        const sessionDuration = document.getElementById('sessionDuration');
        sessionDuration.value = loadLoginDurationPreference();
        sessionDuration.addEventListener('change', function() {
            saveLoginDurationPreference(sessionDuration.value);
        });

        async function handleLogin(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            if (!password) {
                errorMessage.textContent = I18n.t('请输入密码');
                errorMessage.classList.add('show');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = I18n.t('登录中...');
            errorMessage.classList.remove('show');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password,
                        session_duration_days: sessionDuration.value,
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorMessage.textContent = data.error || I18n.t('登录失败');
                    errorMessage.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = I18n.t('登 录');
                }
            } catch (error) {
                errorMessage.textContent = I18n.t('网络错误，请重试');
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = I18n.t('登 录');
            }
        }
        
        // 回车键提交
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
