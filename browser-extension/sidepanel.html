<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OutlookEmail Sidebar</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script src="catalogs.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="i18n.css">
</head>

<body>
  <div class="language-toolbar" data-language-switcher></div>
  <main class="side-shell">
    <header class="side-header">
      <div>
        <h1>OutlookEmail</h1>
        <p id="panelStatus">In-plug-in operation panel</p>
      </div>
      <button id="btnConfig" class="icon-btn" type="button" title="Configuration">⚙</button>
    </header>

    <section id="configPanel" class="config-panel">
      <label>
        <span>Service address</span>
        <input id="serverUrl" type="url" placeholder="https://outlook.icio.eu.org">
      </label>
      <label>
        <span>Web login password</span>
        <input id="password" type="password" placeholder="Enter the web login password">
      </label>
      <label class="check-row">
        <input id="rememberPassword" type="checkbox">
        <span>Remember password to local browser</span>
      </label>
      <button id="btnLogin" class="primary-btn" type="button">Save configuration</button>
      <div id="message" class="message"></div>
    </section>

    <nav class="quick-bar" aria-label="Function entrance">
      <button type="button" data-view="mail">Mailboxes</button>
      <button type="button" data-view="import">Import</button>
      <button type="button" data-view="refresh">Refresh</button>
      <button type="button" data-view="token">Token</button>
      <button type="button" data-view="export">Export</button>
      <button type="button" data-view="tags">Tags</button>
      <button type="button" data-view="settings">Settings</button>
    </nav>

    <section class="content">
      <div class="view-head">
        <h2 id="viewTitle">Mailboxes</h2>
        <button id="btnReload" class="small-btn" type="button">Refresh</button>
      </div>
      <div id="viewContent" class="view-content"></div>
    </section>
  </main>

  <script src="storage.js"></script>
  <script src="api-client.js"></script>
  <script src="sidepanel.js"></script>
</body>

</html>
