<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OutlookEmail console</title>
  <link rel="stylesheet" href="popup.css">
  <script src="catalogs.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="i18n.css">
</head>

<body>
  <div class="language-toolbar" data-language-switcher></div>
  <main class="shell">
    <header class="header">
      <div>
        <h1>OutlookEmail</h1>
        <p>Password login version browser extension</p>
      </div>
      <span class="status-pill" id="statusPill">Not connected</span>
    </header>

    <section class="panel">
      <label class="field">
        <span>Service address</span>
        <input id="serverUrl" type="url" placeholder="http://127.0.0.1:5000" autocomplete="url">
      </label>
      <label class="field">
        <span>Web login password</span>
        <input id="password" type="password" placeholder="Enter the web login password" autocomplete="current-password">
      </label>
      <label class="check-row">
        <input id="rememberPassword" type="checkbox">
        <span>Remember password to local browser</span>
      </label>
      <div class="button-row">
        <button id="btnTest" class="btn btn-secondary" type="button">Verification</button>
        <button id="btnOpen" class="btn btn-primary" type="button">Open the sidebar console</button>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <span>Web function entrance</span>
        <small>Don’t switch tabs</small>
      </div>
      <div class="quick-grid">
        <button class="quick-btn" type="button" data-next="/">Mailbox management</button>
        <button class="quick-btn" type="button" data-next="/#import">Import account</button>
        <button class="quick-btn" type="button" data-next="/#refresh">Token refresh</button>
        <button class="quick-btn" type="button" data-next="/#oauth">Exchange for Token</button>
        <button class="quick-btn" type="button" data-next="/#export">Export mailbox</button>
        <button class="quick-btn" type="button" data-next="/#tags">Tag management</button>
        <button class="quick-btn" type="button" data-next="/#settings">System settings</button>
      </div>
    </section>

    <section class="panel compact">
      <div class="button-row">
        <button id="btnLogout" class="btn btn-secondary" type="button">Open logout</button>
        <button id="btnClear" class="btn btn-danger" type="button">Clear local configuration</button>
      </div>
    </section>

    <div class="message" id="message" role="status"></div>
  </main>

  <script src="storage.js"></script>
  <script src="api-client.js"></script>
  <script src="popup.js"></script>
</body>

</html>
